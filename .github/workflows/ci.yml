name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  api-tests:
    name: API tests with coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vms
          POSTGRES_PASSWORD: vms
          POSTGRES_DB: vms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vms -d vms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      API_PORT: "8090"
      WEB_ORIGIN: http://127.0.0.1:3087
      DATABASE_URL: postgresql://vms:vms@127.0.0.1:5432/vms?schema=public
      TEST_DATABASE_URL: postgresql://vms:vms@127.0.0.1:5432/vms_test?schema=public
      JWT_SECRET: ci-jwt-secret
      COOKIE_SECRET: ci-cookie-secret
      PRISMA_HIDE_UPDATE_MESSAGE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Run API tests with coverage
        run: npm run test:coverage --workspace apps/api

      - name: Upload API coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: warn

  web-tests:
    name: Web tests with coverage
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web tests with coverage
        run: npm run test:coverage --workspace apps/web

      - name: Upload web coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: warn
